version: 2

project_name: hookline

builds:
  - id: hookline
    main: ./cmd/hookline
    binary: hookline
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - docs/ARCHITECTURE.md
      - docs/RECIPES.md
      - docs/WORKPLAN.md
      - docs/demo.gif

checksum:
  algorithm: sha256
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-next"
